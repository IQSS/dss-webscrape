# Web Scraping Using Selenium Python (dss-webscrape): a Quarto website on the dss-theme extension
# (quarto add IQSS/dss-theme). Six pages named after the 2021 bookdown pages, so every old address still answers.
# No code runs: the practice site the examples scrape is offline (2026-08-29), so every page carries
# `execute: eval: false` in its front matter and the Python is shown as written. Quarto's Jupyter engine still
# wants a kernel to read the pages, hence pyproject.toml, uv, and _environment.
project:
  type: dss-theme
  output-dir: _site
  render:
    - index.qmd
    - concepts.qmd
    - web-scraping-approaches.qmd
    - when-to-use-a-browser-driver.qmd
    - finding-web-elements.qmd
    - filling-in-web-forms.qmd

website:
  title: "Web Scraping Using Selenium Python"
  site-url: https://iqss.github.io/dss-webscrape/
  repo-url: https://github.com/IQSS/dss-webscrape
  page-navigation: true
  # The theme contributes the footer's left half; the license is this site's own.
  page-footer:
    right:
      - text: "GPL-3.0"
        href: https://github.com/IQSS/dss-webscrape/blob/main/LICENSE
  sidebar:
    style: floating
    search: true
    contents:
      - { href: index.qmd, text: "Introduction" }
      - concepts.qmd
      - web-scraping-approaches.qmd
      - when-to-use-a-browser-driver.qmd
      - finding-web-elements.qmd
      - filling-in-web-forms.qmd

format:
  dss-theme-html:
    include-in-header:
      # Search Console: the meta tag proves ownership of the URL-prefix property; the token is per Google
      # account, the same on every DSS site. Visitor counts: GoatCounter at dss-webscrape.goatcounter.com; a page
      # view is recorded with its path, title and referrer, no cookie, nothing that identifies the reader.
      # Adding #toggle-goatcounter to any iqss.github.io address switches counting off in that browser.
      - text: |
          <meta name="google-site-verification" content="yQHSXWQVwOPIg4wRh9A8zusoTpcfgW05SWdbVN0rF-s">
          <script data-goatcounter="https://dss-webscrape.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
